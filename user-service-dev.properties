server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_microservice_project
spring.datasource.username=root
spring.datasource.password=Pratik@21

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Acutator
management.endpoints.web.exposure.include=*

#Circuit Breaker
resilience4j.circuitbreaker.instances.notificationService.sliding-window-size=5
resilience4j.circuitbreaker.instances.notificationService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.notificationService.permitted-number-of-calls-in-half-open-state=2
